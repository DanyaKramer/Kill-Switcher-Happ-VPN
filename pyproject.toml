[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "happ-killswitch"
version = "0.1.0"
description = "Аварийный сетевой выключатель для Happ в Ubuntu"
requires-python = ">=3.10"
dependencies = ["textual>=0.80,<2", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
happ-killswitch = "happ_killswitch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
